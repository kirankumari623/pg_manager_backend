# Render "Blueprint": tells Render how to build and run the API.
# Secrets (marked sync: false) are typed into the Render dashboard, never stored here.
services:
  - type: web
    name: pg-manager-api
    runtime: node
    region: singapore          # closest to your Neon database (ap-southeast-1)
    plan: free
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true     # Render creates a long random secret for you
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: SCHEDULER_ENABLED
        value: "false"          # the free plan sleeps; use the outside timer (see README)
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        sync: false
